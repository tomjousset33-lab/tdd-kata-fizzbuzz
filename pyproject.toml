[project]
name = "fizzbuzz-tdd-kata-jousset"
version = "0.1.0"
description = "a fizzbuzz test project"
readme = "README.md"
authors = [
    { name = "Tom Jousset", email = "tom.jousset@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fizzbuzz-kata = "fizzbuzz_tdd_kata_jousset.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-cov>=5.0.0",
    "mypy>=2.4.0",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
